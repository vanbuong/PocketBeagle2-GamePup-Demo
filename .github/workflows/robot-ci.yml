# SPDX-License-Identifier: GPL-2.0-only
name: Robot CI

on:
  push:
    branches: [main, 'cursor/**', 'docs/**', 'robot/**']
    paths: ['robot/core/**', 'robot/sim/**', '.github/workflows/robot-ci.yml']
  pull_request:
    paths: ['robot/core/**', 'robot/sim/**', '.github/workflows/robot-ci.yml']
  workflow_dispatch:

concurrency:
  group: robot-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: Core C tests (ASan/UBSan) + coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends cmake ninja-build lcov
      - name: Build and test with sanitizers
        run: |
          cmake -S robot/core -B build-san -G Ninja -DCMAKE_BUILD_TYPE=Debug -DSANITIZE=ON
          cmake --build build-san
          ctest --test-dir build-san --output-on-failure
      - name: Build and test with coverage
        run: |
          cmake -S robot/core -B build-cov -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCOVERAGE=ON
          cmake --build build-cov
          ctest --test-dir build-cov --output-on-failure
          lcov --capture --directory build-cov --output-file cov.info --rc branch_coverage=1 --ignore-errors mismatch,negative
          lcov --extract cov.info '*/robot/core/src/*' --output-file cov-core.info --rc branch_coverage=1
          lcov --summary cov-core.info --rc branch_coverage=1 | tee cov.txt
          python3 robot/core/tools/check_coverage.py cov.txt --lines 90
      - name: Build with clang (warnings as errors)
        run: |
          sudo apt-get install -y --no-install-recommends clang
          CC=clang cmake -S robot/core -B build-clang -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-clang
          ctest --test-dir build-clang --output-on-failure
      - uses: actions/upload-artifact@v4
        with:
          name: core-coverage
          path: |
            cov-core.info
            cov.txt

  sim:
    name: Closed-loop simulation (C controller + Python plant)
    runs-on: ubuntu-24.04
    needs: core-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: robot/sim/requirements.txt
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends cmake ninja-build
      - run: pip install -r robot/sim/requirements.txt
      - name: Build libbalbot.so
        run: |
          cmake -S robot/core -B robot/core/build-shared -G Ninja -DBUILD_SHARED=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build robot/core/build-shared --target balbot
      - name: SIM tests
        working-directory: robot/sim
        env:
          BALBOT_MC: '12'
        run: python3 -m pytest -q --junitxml=sim.xml test_sim.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sim-results
          path: robot/sim/sim.xml
