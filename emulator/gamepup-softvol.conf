# MAX98357A has no hardware mixer. The music player opens this PCM and
# changes loudness with: amixer -c GamePupMAX98357 sset PCM N%
# mpv itself stays at unity gain.
pcm.gamepup {
    type softvol
    slave.pcm "plughw:GamePupMAX98357,0"
    control {
        name "PCM"
        card "GamePupMAX98357"
    }
    min_dB -51.0
    max_dB 0.0
    resolution 100
}
